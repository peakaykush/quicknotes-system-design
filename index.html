<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Cloud API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <div class="header-container">
      <h1>QuickNotes Cloud Client</h1>
      <p>Interactive REST API prototype communicating with cloud backend services.</p>
    </div>
  </header>

  <main>
    <!-- Status Feedback -->
    <div class="status-container">
      <p id="status" role="status">Ready. Click "Load notes" to fetch data from the server.</p>
    </div>

    <!-- Section 1: Note Creation Form -->
    <section class="card form-section">
      <h2>Create a Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title <span class="required">*</span></label>
          <input type="text" id="title-input" placeholder="Note title (max 100 characters)..." autocomplete="off">
        </div>
        <div class="form-group">
          <label for="body-input">Body</label>
          <textarea id="body-input" rows="4" placeholder="Write your note content here (optional)..."></textarea>
        </div>
        <button type="submit" id="submit-btn">Create Note</button>
      </form>
    </section>

    <!-- Section 2: Notes Collection -->
    <section class="card list-section">
      <div class="list-header">
        <h2>Server Notes</h2>
        <button id="load-btn" type="button">Load notes</button>
      </div>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes System Design. All rights reserved.</p>
  </footer>
</body>
</html>
